repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Run Ruff linter
        entry: ruff check
        language: system  # Use the system Python environment
        types_or: [python, pyi, jupyter]
      - id: ruff-format-check
        name: Check Ruff formatting
        entry: ruff format --check
        language: system  # Use the system Python environment
        types_or: [python, pyi, jupyter, markdown]

  - repo: local
    hooks:
      - id: conventional-pre-commit
        name: Check Conventional Commit
        entry: conventional-pre-commit
        language: system
        stages: [commit-msg]
      - id: generate-api-docs
        name: Generate API documentation
        entry: python scripts/generate_api_docs.py
        language: system
        pass_filenames: false
        files: ^(src/.*\.py|scripts/.*\.py|docs/api\.md)$
      - id: convert-notebooks
        name: Check generated notebook documentation
        entry: python docs/convert_notebooks.py --check
        language: system
        pass_filenames: false
        files: ^(notebooks/.*\.py|docs/notebooks/.*\.md|docs/convert_notebooks\.py)$
      - id: pydoclint
        name: Run pydoclint
        entry: pydoclint src tests
        language: system
        pass_filenames: false
      - id: build-docs
        name: Build documentation
        entry: zensical build --clean --strict
        language: system
        pass_filenames: false
      - id: pytest
        name: Run pytest
        entry: pytest -n auto
        language: system
        pass_filenames: false
